project_id = "koreango"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "koreango://"
additional_redirect_urls = ["koreango://auth/callback", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
# Production: turn confirmations back on in the Supabase dashboard.

# TODO: enable Google sign-in.
#   1. Create OAuth credentials in Google Cloud Console
#   2. Add the client id / secret as Supabase secrets
#   3. Set enabled = true below
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
