name: CI

on:
  push:
    branches: ['**']
  pull_request:

# No deployment job lives here on purpose: nothing in CI needs a production
# secret, so a leaked workflow token cannot ship a release.
jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Check that no secrets were committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|service-account|\.keystore$|\.jks$'; then
            echo "::error::A secret-looking file is tracked by git"
            exit 1
          fi
          echo "No secret files tracked."
