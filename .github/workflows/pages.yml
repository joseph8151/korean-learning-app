name: Deploy legal pages

# Publishes site/ (landing page, privacy policy, terms) to GitHub Pages.
# Google Play requires a publicly reachable privacy policy URL.
#
# Enable once in the repo: Settings → Pages → Source: "GitHub Actions".
# Note: GitHub Pages on a private repository requires a paid GitHub plan.

on:
  push:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Deploy only from whatever the repository's default branch happens to be,
    # rather than hard-coding a name. This repo's default is currently the
    # development branch, not `main`, so a hard-coded filter would never fire.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
